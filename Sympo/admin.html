<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREQUENZA '26 - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gold: { 400: '#F6E05E', 500: '#D4AF37', 600: '#B7791F', 700: '#975A16' },
                        darkbg: '#0a0a0c',
                        cardbg: '#121318'
                    }
                }
            }
        }
    </script>
    <style>
        .gold-gradient-text {
            background: linear-gradient(135deg, #FFF099 0%, #D4AF37 50%, #996515 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="bg-darkbg text-gray-200 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-cardbg border-b border-gold-500/20 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <span class="text-xl md:text-2xl font-black tracking-widest gold-gradient-text uppercase">FREQUENZA '26 <span class="text-sm font-normal text-gray-400">ADMIN</span></span>
                </div>
                <div id="navActions" class="hidden">
                    <button onclick="logout()" class="text-sm font-bold bg-red-500/10 text-red-400 border border-red-500/30 px-4 py-2 rounded-lg hover:bg-red-500/20 transition">Logout <i class="fa-solid fa-sign-out-alt ml-1"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Login View -->
    <div id="loginView" class="flex-grow flex items-center justify-center p-4">
        <div class="bg-cardbg border border-gold-500/30 p-8 rounded-2xl shadow-[0_0_20px_rgba(212,175,55,0.1)] w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-center text-white">Admin Login</h2>
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold mb-1 text-gray-300">Username</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
                        <input type="text" id="username" required class="w-full bg-black/60 border border-gold-500/30 rounded-lg py-2.5 pl-10 pr-3 text-sm focus:border-gold-400 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1 text-gray-300">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
                        <input type="password" id="password" required class="w-full bg-black/60 border border-gold-500/30 rounded-lg py-2.5 pl-10 pr-3 text-sm focus:border-gold-400 outline-none">
                    </div>
                </div>
                <div id="loginError" class="hidden text-red-400 text-xs text-center"></div>
                <button type="submit" id="loginBtn" class="w-full py-3 rounded-lg font-black bg-gradient-to-r from-gold-600 to-gold-400 text-black hover:from-gold-500 hover:to-yellow-200 transition transform hover:-translate-y-0.5 mt-2">Login</button>
            </form>
        </div>
    </div>

    <!-- Dashboard View -->
    <div id="dashboardView" class="hidden flex-grow p-4 md:p-8">
        <div class="max-w-7xl mx-auto space-y-6">
            
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <h2 class="text-2xl font-bold text-white">Registrations <span id="regCount" class="text-sm font-normal text-gray-400 ml-2">(0 total)</span></h2>
                <div class="flex gap-2">
                    <button onclick="fetchRegistrations()" class="bg-gray-800 text-gold-400 px-4 py-2 rounded-lg text-sm font-bold border border-gold-500/30 hover:bg-gray-700 transition"><i class="fa-solid fa-sync mr-1"></i> Refresh</button>
                    <button onclick="downloadCSV()" class="bg-gold-500/20 text-gold-400 px-4 py-2 rounded-lg text-sm font-bold border border-gold-500/50 hover:bg-gold-500/30 transition"><i class="fa-solid fa-download mr-1"></i> Export CSV</button>
                </div>
            </div>

            <!-- Filters -->
            <div class="bg-cardbg border border-gold-500/20 p-4 rounded-xl flex flex-wrap gap-4 items-end">
                <div>
                    <label class="block text-xs font-semibold mb-1 text-gray-400">Search Name/ID/UTR</label>
                    <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Search..." class="bg-black border border-gray-700 rounded-lg p-2 text-sm focus:border-gold-400 outline-none w-full md:w-64">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1 text-gray-400">Status</label>
                    <select id="statusFilter" onchange="filterTable()" class="bg-black border border-gray-700 rounded-lg p-2 text-sm focus:border-gold-400 outline-none">
                        <option value="all">All</option>
                        <option value="pending">Pending</option>
                        <option value="verified">Verified</option>
                        <option value="rejected">Rejected</option>
                    </select>
                </div>
            </div>

            <!-- Table -->
            <div class="bg-cardbg border border-gold-500/20 rounded-xl overflow-hidden overflow-x-auto shadow-lg">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-black/60 border-b border-gold-500/20 text-xs uppercase text-gray-400">
                        <tr>
                            <th class="px-4 py-3">Reg ID</th>
                            <th class="px-4 py-3">Participant</th>
                            <th class="px-4 py-3">Events</th>
                            <th class="px-4 py-3">Status</th>
                            <th class="px-4 py-3">Transaction ID (UTR)</th>
                            <th class="px-4 py-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="registrationsTable" class="divide-y divide-gray-800">
                        <!-- Rows injected here -->
                    </tbody>
                </table>
                <div id="tableLoading" class="p-8 text-center text-gray-400 hidden"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>Loading...</div>
                <div id="tableEmpty" class="p-8 text-center text-gray-500 hidden">No registrations found.</div>
            </div>
        </div>
    </div>

    <!-- Proof Modal -->
    <div id="proofModal" class="fixed inset-0 bg-black/90 backdrop-blur-sm hidden items-center justify-center p-4 z-[60]">
        <div class="bg-cardbg border border-gold-500/30 w-full max-w-2xl rounded-xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-gold-500/20 flex justify-between items-center bg-black/60">
                <h3 class="font-bold text-white">Payment Proof</h3>
                <button onclick="closeProofModal()" class="text-gray-400 hover:text-white transition"><i class="fa-solid fa-times text-xl"></i></button>
            </div>
            <div class="p-4 flex-grow overflow-auto flex items-center justify-center min-h-[300px]">
                <img id="proofImage" src="" alt="Proof" class="max-w-full h-auto rounded border border-gray-700 hidden">
                <iframe id="proofPdf" src="" class="w-full h-[60vh] hidden border-0 rounded"></iframe>
            </div>
            <div class="p-4 border-t border-gold-500/20 bg-black/40 flex justify-end gap-2" id="proofActions">
                <!-- Action buttons contextually added here -->
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';
        let registrationsList = [];
        let currentToken = localStorage.getItem('adminToken');

        if (currentToken) {
            showDashboard();
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errDiv = document.getElementById('loginError');
            
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            btn.disabled = true;
            errDiv.classList.add('hidden');

            try {
                const res = await fetch(`${API_BASE}/admin/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Login failed');
                
                currentToken = data.token;
                localStorage.setItem('adminToken', currentToken);
                showDashboard();
            } catch (err) {
                errDiv.textContent = err.message;
                errDiv.classList.remove('hidden');
            } finally {
                btn.innerHTML = 'Login';
                btn.disabled = false;
            }
        }

        function logout() {
            localStorage.removeItem('adminToken');
            currentToken = null;
            document.getElementById('loginView').classList.remove('hidden');
            document.getElementById('dashboardView').classList.add('hidden');
            document.getElementById('navActions').classList.add('hidden');
            document.getElementById('loginForm').reset();
        }

        function showDashboard() {
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('dashboardView').classList.remove('hidden');
            document.getElementById('navActions').classList.remove('hidden');
            fetchRegistrations();
        }

        async function fetchRegistrations() {
            const tableBody = document.getElementById('registrationsTable');
            const loading = document.getElementById('tableLoading');
            const empty = document.getElementById('tableEmpty');
            
            tableBody.innerHTML = '';
            loading.classList.remove('hidden');
            empty.classList.add('hidden');
            document.getElementById('regCount').textContent = `(Loading...)`;

            try {
                const res = await fetch(`${API_BASE}/admin/registrations`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                
                if (res.status === 401 || res.status === 403) {
                    logout();
                    return alert('Session expired. Please login again.');
                }
                
                const data = await res.json();
                registrationsList = data;
                renderTable();
            } catch (err) {
                alert('Error fetching registrations: ' + err.message);
            } finally {
                loading.classList.add('hidden');
            }
        }

        function renderTable() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;
            const tableBody = document.getElementById('registrationsTable');
            const empty = document.getElementById('tableEmpty');
            
            let filtered = registrationsList.filter(r => {
                const searchMatch = !search || 
                    (r.name && r.name.toLowerCase().includes(search)) || 
                    (r.registrationId && r.registrationId.toLowerCase().includes(search)) ||
                    (r.transactionId && r.transactionId.toLowerCase().includes(search));
                const statusMatch = status === 'all' || r.paymentStatus === status;
                return searchMatch && statusMatch;
            });

            document.getElementById('regCount').textContent = `(${filtered.length} total)`;
            tableBody.innerHTML = '';

            if (filtered.length === 0) {
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            filtered.forEach(r => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-800/50 transition border-b border-gray-800 last:border-0";
                
                // Status badge
                let statusBadge = '';
                if(r.paymentStatus === 'pending') statusBadge = '<span class="bg-yellow-500/20 text-yellow-500 border border-yellow-500/30 px-2 py-0.5 rounded text-xs font-bold uppercase">Pending</span>';
                if(r.paymentStatus === 'verified') statusBadge = '<span class="bg-green-500/20 text-green-400 border border-green-500/30 px-2 py-0.5 rounded text-xs font-bold uppercase">Verified</span>';
                if(r.paymentStatus === 'rejected') statusBadge = '<span class="bg-red-500/20 text-red-400 border border-red-500/30 px-2 py-0.5 rounded text-xs font-bold uppercase">Rejected</span>';

                tr.innerHTML = `
                    <td class="px-4 py-3 font-mono text-xs text-gold-400">${r.registrationId}</td>
                    <td class="px-4 py-3">
                        <div class="font-bold text-white">${escapeHtml(r.name)}</div>
                        <div class="text-xs text-gray-500">${escapeHtml(r.college)}</div>
                        <div class="text-xs text-gray-400">${escapeHtml(r.phone)}</div>
                    </td>
                    <td class="px-4 py-3 text-xs">
                        <div class="text-gray-300">T: <span class="font-bold">${escapeHtml(r.techEvent)}</span></div>
                        ${r.nonTechEvent ? `<div class="text-gray-400">N: ${escapeHtml(r.nonTechEvent)}${r.nonTechEvent === 'IPL Auction' ? ` [${escapeHtml(r.iplTeamName)}]` : ''}</div>` : ''}
                    </td>
                    <td class="px-4 py-3">${statusBadge}</td>
                    <td class="px-4 py-3 font-mono text-xs text-gray-300 select-all">${escapeHtml(r.transactionId)}</td>
                    <td class="px-4 py-3 text-right space-x-2">
                        <button onclick="viewProof('${r._id}', '${r.paymentStatus}')" class="text-xs bg-black border border-gold-500/50 text-gold-400 px-3 py-1.5 rounded hover:bg-gold-500/10 transition" title="View Details & Proof">Review</button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        function filterTable() {
            renderTable();
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                 .toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        function viewProof(id, currentStatus) {
            const r = registrationsList.find(x => x._id === id);
            if (!r) return;
            
            const proofUrl = `${API_BASE}/admin/registrations/${id}/proof?token=${currentToken}`;
            const img = document.getElementById('proofImage');
            const pdf = document.getElementById('proofPdf');
            
            img.classList.add('hidden');
            pdf.classList.add('hidden');
            
            if (r.paymentProofPath.toLowerCase().endsWith('.pdf')) {
                pdf.src = proofUrl;
                pdf.classList.remove('hidden');
            } else {
                img.src = proofUrl;
                img.classList.remove('hidden');
            }

            const actions = document.getElementById('proofActions');
            actions.innerHTML = `
                <button onclick="closeProofModal()" class="px-4 py-2 text-sm text-gray-300 hover:text-white mr-auto">Cancel</button>
            `;

            if (currentStatus === 'pending') {
                actions.innerHTML += `
                    <button onclick="updateStatus('${id}', 'rejected')" class="px-4 py-2 rounded font-bold text-sm bg-red-500/20 text-red-500 border border-red-500 hover:bg-red-500 hover:text-white transition">Reject</button>
                    <button onclick="updateStatus('${id}', 'verified')" class="px-4 py-2 rounded font-bold text-sm bg-green-500/20 text-green-400 border border-green-500 hover:bg-green-500 hover:text-white transition">Verify & Accept</button>
                `;
            } else if (currentStatus === 'verified') {
                actions.innerHTML += `
                    <button onclick="updateStatus('${id}', 'rejected')" class="px-4 py-2 rounded font-bold text-sm bg-red-500/20 text-red-500 border border-red-500 hover:bg-red-500 hover:text-white transition">Reject instead</button>
                `;
            } else if (currentStatus === 'rejected') {
                actions.innerHTML += `
                    <button onclick="updateStatus('${id}', 'verified')" class="px-4 py-2 rounded font-bold text-sm bg-green-500/20 text-green-400 border border-green-500 hover:bg-green-500 hover:text-white transition">Verify instead</button>
                `;
            }
            
            document.getElementById('proofModal').classList.remove('hidden');
        }

        function closeProofModal() {
            document.getElementById('proofModal').classList.add('hidden');
            document.getElementById('proofImage').src = "";
            document.getElementById('proofPdf').src = "";
        }

        async function updateStatus(id, newStatus) {
            if(!confirm(`Are you sure you want to mark this registration as ${newStatus.toUpperCase()}?`)) return;

            try {
                const res = await fetch(`${API_BASE}/admin/registrations/${id}/verify`, {
                    method: 'PATCH',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${currentToken}` 
                    },
                    body: JSON.stringify({ status: newStatus })
                });
                
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed to update status');
                
                closeProofModal();
                fetchRegistrations(); // Refresh list to get updated counts and data
            } catch (err) {
                alert(err.message);
            }
        }

        function downloadCSV() {
            window.location.href = `${API_BASE}/admin/registrations/export?token=${currentToken}`;
        }
    </script>
</body>
</html>
